/* Apply the saved (or system) theme before first paint to avoid a flash. */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark-pending');
  }
})();
</script>

<script>
(function () {
  var body = document.body, icon = document.getElementById('theme-icon');
  function set(dark) {
    body.classList.toggle('dark', dark);
    if (icon) icon.textContent = dark ? 'dark_mode' : 'light_mode';
  }
  set(document.documentElement.classList.contains('dark-pending'));
  document.documentElement.classList.remove('dark-pending');
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var dark = !body.classList.contains('dark');
    set(dark);
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
})();
</script>
